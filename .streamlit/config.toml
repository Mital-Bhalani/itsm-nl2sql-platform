# Streamlit look and feel for the ITSM Insights UI (read from the project root, where
# run_app.py starts Streamlit).
[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F7F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
font = "sans serif"
baseRadius = "0.6rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#EEF0FA"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
