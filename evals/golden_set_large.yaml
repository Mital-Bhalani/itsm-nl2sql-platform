      SELECT COUNT(*) AS within_sla
      FROM incidents i
      JOIN sla_targets s ON s.priority = i.priority
      JOIN assignment_groups g ON g.id = i.assignment_group_id
      WHERE g.name = 'Service Desk' AND i.status IN ('Resolved', 'Closed') AND i.resolved_at >= '2026-08-01' AND i.resolved_at < '2026-09-01' AND (julianday(i.resolved_at) - julianday(i.opened_at)) * 1440 <= s.target_minutes
    expected:
