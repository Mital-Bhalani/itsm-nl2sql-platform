      SELECT g.name AS team, ROUND(100.0 * AVG(CASE WHEN i.reopened_count > 0 THEN 1.0 ELSE 0.0 END), 1) AS reopen_pct
      FROM incidents i
      JOIN assignment_groups g ON g.id = i.assignment_group_id
      GROUP BY g.name
      ORDER BY g.name
    expected:
      columns: ["team", "reopen_pct"]
      rows: [["Application Support", 9.5], ["Database", 11.5], ["Infrastructure", 9.9], ["Network", 11.5], ["Service Desk", 9.2]]
    order_matters: false
    tolerance: 0.1
    ambiguous: false
    notes: "Metric reopen_rate as a percentage; the denominator is all incidents of the team."

  - id: J10
    category: multi_table_join
    question: "Which priority has the longest average resolution time?"
    reference_sql: |
      SELECT i.priority
      FROM incidents i
      WHERE i.status IN ('Resolved', 'Closed')
      GROUP BY i.priority
      ORDER BY AVG((julianday(i.resolved_at) - julianday(i.opened_at)) * 1440) DESC
      LIMIT 1
    expected:
      columns: ["priority"]
      rows: [[4]]
    order_matters: false
    ambiguous: false
    notes: "Priority 4 (Low): the 5-day target lets tickets run longest. Only the priority is compared."

  - id: J11
    category: multi_table_join
    question: "How many overdue incidents does each team have?"
    reference_sql: |
      SELECT g.name AS team, SUM(CASE WHEN i.status IN ('New', 'In Progress', 'On Hold') AND (julianday('2026-09-28') - julianday(i.opened_at)) * 1440 > s.target_minutes THEN 1 ELSE 0 END) AS overdue
      FROM assignment_groups g
      LEFT
      JOIN incidents i ON i.assignment_group_id = g.id
      LEFT
      JOIN sla_targets s ON s.priority = i.priority
      GROUP BY g.name
      ORDER BY g.name
    expected:
      columns: ["team", "overdue"]
      rows: [["Application Support", 837], ["Database", 607], ["Infrastructure", 628], ["Network", 694], ["Service Desk", 1608]]
    order_matters: false
    ambiguous: false
    notes: "Glossary 'overdue': open (New, In Progress, On Hold) and already past its SLA target as of 2026-09-28. Not the same as SLA breach, which counts resolved incidents."

  - id: J12
    category: multi_table_join
    question: "How many upcoming changes does each team have?"
    reference_sql: |
      SELECT g.name AS team, COUNT(c.id) AS upcoming_changes
      FROM assignment_groups g
      LEFT
      JOIN changes c ON c.assignment_group_id = g.id AND c.planned_start >= '2026-09-28' AND c.status <> 'Cancelled'
      GROUP BY g.name
      ORDER BY g.name
    expected:
      columns: ["team", "upcoming_changes"]
      rows: [["Application Support", 194], ["Database", 211], ["Infrastructure", 299], ["Network", 238], ["Service Desk", 58]]
    order_matters: false
    ambiguous: false
    notes: "Per-team version of D10; teams with no upcoming change must show 0."

  - id: J13
    category: multi_table_join
