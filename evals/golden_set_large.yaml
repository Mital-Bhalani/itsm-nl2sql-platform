    question: "Which team has the highest SLA breach rate?"
    reference_sql: |
      SELECT g.name AS team
      FROM incidents i
      JOIN sla_targets s ON s.priority = i.priority
      JOIN assignment_groups g ON g.id = i.assignment_group_id
      WHERE i.status IN ('Resolved', 'Closed')
      GROUP BY g.name
      ORDER BY AVG(CASE WHEN (julianday(i.resolved_at) - julianday(i.opened_at)) * 1440 > s.target_minutes THEN 1.0 ELSE 0.0 END) DESC, g.name
