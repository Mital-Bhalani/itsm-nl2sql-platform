          FROM incidents i
          JOIN sla_targets s ON s.priority = i.priority
          WHERE i.status IN ('Resolved', 'Closed') AND (julianday(i.resolved_at) - julianday(i.opened_at)) * 1440 > s.target_minutes AND i.priority IN (1, 2)
        rows: [[338, 1013]]
    notes: "Two layouts of the same numbers are accepted."

