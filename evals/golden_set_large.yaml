  - id: D07
    category: date_range
    question: "How many high-risk changes are planned this month?"
    reference_sql: |
      SELECT COUNT(*) AS high_risk_changes
      FROM changes c
      WHERE c.risk = 'High' AND c.status <> 'Cancelled' AND c.planned_start >= '2026-09-01' AND c.planned_start < '2026-10-01'
    expected:
      columns: ["high_risk_changes"]
      rows: [[209]]
    order_matters: false
    ambiguous: true
    alternatives:
      - reading: "cancelled changes included"
        reference_sql: |
          SELECT COUNT(*) AS high_risk_changes
          FROM changes c
          WHERE c.risk = 'High' AND c.planned_start >= '2026-09-01' AND c.planned_start < '2026-10-01'
        rows: [[225]]
      - reading: "this month up to the as-of date (glossary 'this month'), not cancelled"
        reference_sql: |
          SELECT COUNT(*) AS high_risk_changes
          FROM changes c
          WHERE c.risk = 'High' AND c.status <> 'Cancelled' AND c.planned_start >= '2026-09-01' AND c.planned_start < '2026-09-28'
        rows: [[192]]
    notes: "Changes have no opened_at: the time column is planned_start. 'Planned this month' most naturally covers the whole of September 2026, windows after the as-of date included, and a cancelled change is no longer planned; both the cancelled-included and the glossary up-to-as-of readings are also accepted. All give 3 at the default size but differ on the large set."

