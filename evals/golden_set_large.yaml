          WHERE i.status IN ('Resolved', 'Closed') AND i.opened_at >= '2026-08-01' AND i.opened_at < '2026-09-01'
          GROUP BY i.priority
        rows: [[1, 48], [2, 171], [3, 539], [4, 320]]
      - reading: "breach counted in the month the incident was resolved (resolved_at)"
        reference_sql: |
          SELECT i.priority, SUM(CASE WHEN (julianday(i.resolved_at) - julianday(i.opened_at)) * 1440 > s.target_minutes THEN 1 ELSE 0 END) AS breaches
