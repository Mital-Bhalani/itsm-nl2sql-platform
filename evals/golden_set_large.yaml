    question: "What was the mean time to resolve for incidents opened last month?"
    reference_sql: |
      SELECT AVG((julianday(i.resolved_at) - julianday(i.opened_at)) * 1440) AS mttr_minutes
      FROM incidents i
      WHERE i.status IN ('Resolved', 'Closed') AND i.opened_at >= '2026-08-01' AND i.opened_at < '2026-09-01'
