          JOIN sla_targets s ON s.priority = i.priority
          JOIN assignment_groups g ON g.id = i.assignment_group_id
          WHERE g.name = 'Service Desk' AND i.status IN ('Resolved', 'Closed') AND i.opened_at >= '2026-08-01' AND i.opened_at < '2026-09-01' AND (julianday(i.resolved_at) - julianday(i.opened_at)) * 1440 <= s.target_minutes
        rows: [[2432]]
    notes: "The complement of a breach: resolution minutes <= target. 'Resolved last month' filters resolved_at (glossary 'resolved incident', as in D04): 20 at the default size. Filtering opened_at instead (the SLA-breach convention, 19) is also accepted."

