name: CI

# Runs on every push and pull request. No API key is needed: the Python tests use a fake
# model, and the eval self-test scores the reference SQL instead of calling a model.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (tests, catalog, eval self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Build database and catalog
        run: |
          python db/seed.py
          python semantics/build_catalog.py
      - name: Build large database and catalog
        run: |
          python db/seed.py --incidents 50000 --changes 10000 --out db/tickets_large.sqlite
          python semantics/build_catalog.py --db db/tickets_large.sqlite
      - name: Golden sets are up to date
        run: |
          python evals/make_golden_set.py
          python evals/make_golden_set.py --db db/tickets_large.sqlite --out evals/golden_set_large.yaml
          git diff --exit-code -- evals/golden_set.yaml evals/golden_set_large.yaml
      - name: Eval self-test (both golden sets)
        run: |
          python -B evals/run_evals.py --self-test
          python -B evals/run_evals.py --golden evals/golden_set_large.yaml --self-test
      - name: Unit and API tests
        run: python -B -m pytest tests -p no:cacheprovider -q

  web:
    name: React UI (type-check, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Built UI is served by the API
        working-directory: .
        run: |
          python -m pip install -r requirements.txt
          python db/seed.py && python semantics/build_catalog.py
          python -B -m uvicorn api.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/web/ | grep -q '<div id="root">'
          curl -sf http://127.0.0.1:8000/api/reconcile | python -c "import sys, json; c = json.load(sys.stdin)['checks']; assert all(x['match'] for x in c), c; print(len(c), 'checks match')"
